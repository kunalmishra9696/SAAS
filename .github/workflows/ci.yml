name: Build and typecheck

on:
  push:
    branches:
      - main
      - "rebuild/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vallu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install

      - name: Type-check
        run: bun run lint

      - name: Build production assets
        run: bun run build
